name: OTC scan
on:
  schedule:
    - cron: "0 1 * * 2-6"   # 6pm Pacific (PDT), Mon–Fri closes. Use "0 2 * * 2-6" in winter (PST).
  workflow_dispatch:         # lets you hit "Run workflow" manually
permissions:
  contents: write
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python scanner.py
        env:
          MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          MAX_PRICE: "0.001"
      - name: Save history
        run: |
          git config user.name "scanner-bot"
          git config user.email "scanner-bot@users.noreply.github.com"
          git add data/
          git commit -m "scan $(date -u +%F)" || exit 0
          git push
